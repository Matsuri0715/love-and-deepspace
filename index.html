    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --accent-cyan: #00f2ff;
            --color-xavier: #87ceeb; --color-zayne: #a0d8de;
            --color-rafayel: #c3a6ff; --color-sylus: #ff4d4d; --color-caleb: #ffcc99;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            flex-direction: row; /* 桌面版橫向排列 */
        }

        /* --- 側邊欄響應式設定 --- */
        .sidebar {
            width: 250px;
            background: #010409;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        .brand { font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan); margin-bottom: 30px; text-shadow: 0 0 10px var(--accent-cyan); }
        .nav-group { margin-bottom: 20px; }
        .nav-title { font-size: 0.8rem; color: #8b949e; text-transform: uppercase; margin-bottom: 10px; }
        .nav-item { padding: 10px; cursor: pointer; border-radius: 6px; transition: 0.3s; margin-bottom: 5px; }
        .nav-item.active { background: #23863622; color: #3fb950; border-left: 3px solid #3fb950; }

        .main-content { flex: 1; padding: 20px; overflow-y: auto; }

        /* --- 手機版佈局調整 (螢幕小於 768px) --- */
        @media (max-width: 768px) {
            body { flex-direction: column; } /* 手機版改為直向排列 */
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #30363d;
                padding: 15px;
                box-sizing: border-box;
            }
            .brand { margin-bottom: 10px; text-align: center; }
            .nav-group { display: none; } /* 手機版隱藏非必要選單 */
        }

        /* 進度統計區 */
        .progress-section { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 20px; }
        .stats-text { font-size: 1rem; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
        #percent-text { color: var(--accent-cyan); }
        .progress-bar-bg { background: #30363d; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #00f2ff, #3fb950); height: 100%; width: 0%; transition: width 0.6s ease; }

        /* 篩選群組 */
        .filter-group { background: #0d1117; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #21262d; }
        .filter-label { font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; display: block; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 14px; border: 1px solid #30363d; background: var(--card-bg); color: white; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
        .filter-btn.active { background: var(--accent-cyan); color: #000; font-weight: bold; border-color: var(--accent-cyan); }
        .filter-btn.active.xavier { background: var(--color-xavier); }
        .filter-btn.active.zayne { background: var(--color-zayne); }
        .filter-btn.active.rafayel { background: var(--color-rafayel); }
        .filter-btn.active.sylus { background: var(--color-sylus); }
        .filter-btn.active.caleb { background: var(--color-caleb); }

        /* 卡片設計 */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .event-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 8px; padding: 15px; transition: 0.3s; }
        .badge { display: inline-block; padding: 2px 8px; font-size: 11px; border-radius: 4px; margin-bottom: 10px; }
        .type-crisis { background: #ff4d4d22; color: #ff4d4d; border: 1px solid #ff4d4d; }
        .type-encounter { background: #00f2ff22; color: #00f2ff; border: 1px solid #00f2ff; }
        .chap-tag { font-size: 0.75rem; color: #8b949e; margin-bottom: 5px; display: block; }
        .item-name { font-size: 1rem; font-weight: bold; margin-bottom: 10px; }
        label { cursor: pointer; font-size: 0.9rem; }
    </style>
</head>

        // 渲染函數
        function render() {
            const container = document.getElementById('card-container');
            container.innerHTML = ''; // 清空

            // 過濾資料
            const filteredData = gameData.filter(item => {
                const charMatch = (currentChar === 'All' || item.char === currentChar);
                const chapMatch = (currentChap === 'All' || item.chap === currentChap);
                return charMatch && chapMatch;
            });

            // 繪製卡片
            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'event-card';
                const isChecked = item.status ? 'checked' : '';
                const chapName = item.chap === 'tumeng' ? '尋找圖蒙' : '最後的告別';
                const badgeClass = item.type === 'crisis' ? 'type-crisis' : 'type-encounter';
                const badgeText = item.type === 'crisis' ? '偶發危機' : '偶發遭遇';

                card.innerHTML = `
                    <span class="chap-tag">[ ${chapName} ]</span>
                    <span class="badge ${badgeClass}">${badgeText}</span>
                    <div class="item-name">${item.name}</div>
                    <div style="font-size: 0.8rem; color: #8b949e; margin-bottom: 10px;">角色: ${item.char}</div>
                    <label style="cursor:pointer">
                        <input type="checkbox" ${isChecked} onchange="updateStatus('${item.id}', this.checked)"> 已達成
                    </label>
                `;
                container.appendChild(card);
            });

            // 更新統計
            updateProgress(filteredData);
        }

        // 修改後的進度條更新 (動態計算當前組合的基數)
        function updateProgress(list) {
            const total = list.length;
            const completed = list.filter(i => i.status).length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('total-count').innerText = total;
            document.getElementById('completed-count').innerText = completed;
            document.getElementById('percent-text').innerText = percent + '%';
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        // 角色篩選切換
        function setChar(char, btn) {
            document.querySelectorAll('#char-filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentChar = char;
            render();
        }

        // 章節篩選切換
        function setChap(chap, btn) {
            document.querySelectorAll('#chap-filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentChap = chap;
            render();
        }

        // 即時狀態更新
        function updateStatus(id, checked) {
            const item = gameData.find(i => i.id === id);
            if (item) item.status = checked;

            // 重新計算目前畫面上該組資料的進度
            const currentFiltered = gameData.filter(i => {
                const charMatch = (currentChar === 'All' || i.char === currentChar);
                const chapMatch = (currentChap === 'All' || i.chap === currentChap);
                return charMatch && chapMatch;
            });
            updateProgress(currentFiltered);
        }

        window.onload = render;
    </script>
