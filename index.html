    <style>
        /* --- 核心視覺設定 (設計系美化區) --- */
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --accent-cyan: #00f2ff;
            /* 角色代表色 */
            --color-xavier: #87ceeb; /* 沈星回-天藍 */
            --color-zayne: #a0d8de;  /* 黎深-青 */
            --color-rafayel: #c3a6ff; /* 祁煜-紫 */
            --color-sylus: #ff4d4d;   /* 秦徹-紅 */
            --color-caleb: #ffcc99;  /* 夏以晝-橘 */
            --color-mc: #c9d1d9;      /* 主控-灰 */
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 側邊導覽列 --- */
        .sidebar {
            width: 250px;
            background: #010409;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-cyan);
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .nav-group { margin-bottom: 20px; }
        .nav-title { font-size: 0.8rem; color: #8b949e; text-transform: uppercase; margin-bottom: 10px; }
        .nav-item { 
            padding: 10px; cursor: pointer; border-radius: 6px; transition: 0.3s; 
            margin-bottom: 5px;
        }
        .nav-item:hover { background: #1f242c; color: var(--accent-cyan); }
        .nav-item.active { background: #23863622; color: #3fb950; border-left: 3px solid #3fb950; }

        /* --- 主要內容區 --- */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* 角色篩選器 */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #30363d;
            background: var(--card-bg);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active.xavier { background: var(--color-xavier); color: #000; }
        .filter-btn.active.zayne { background: var(--color-zayne); color: #000; }
        .filter-btn.active.rafayel { background: var(--color-rafayel); color: #000; }
        .filter-btn.active.sylus { background: var(--color-sylus); color: #000; }
        .filter-btn.active.caleb { background: var(--color-caleb); color: #000; }

        /* --- 新增：進度條樣式 --- */
        .progress-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .stats-text {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        #percent-text { color: var(--accent-cyan); text-shadow: 0 0 5px var(--accent-cyan); }

        .progress-bar-bg {
            background: #30363d;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #000;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00f2ff, #3fb950);
            height: 100%;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* 卡片佈局 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px;
            transition: 0.3s;
        }

        .event-card:hover { border-color: var(--accent-cyan); transform: translateY(-3px); }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .type-crisis { background: #ff4d4d33; color: #ff4d4d; border: 1px solid #ff4d4d; }
        .type-encounter { background: #00f2ff33; color: #00f2ff; border: 1px solid #00f2ff; }

        .item-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .item-status { font-size: 0.9rem; color: #8b949e; margin-bottom: 10px; }
    </style>
</head>

        // --- 新增：更新進度條函式 ---
        function updateProgress(filteredData) {
            const total = filteredData.length;
            const completed = filteredData.filter(item => item.status === true).length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('total-count').innerText = total;
            document.getElementById('completed-count').innerText = completed;
            document.getElementById('percent-text').innerText = percent + '%';
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        // 核心渲染函式
        function renderCards(category, charFilter = 'All') {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            
            const data = gameData[category] || [];
            const filteredData = charFilter === 'All' ? data : data.filter(item => item.char === charFilter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'event-card';
                
                const isChecked = item.status === true ? 'checked' : '';
                const badgeClass = item.type === 'crisis' ? 'type-crisis' : 'type-encounter';
                const badgeText = item.type === 'crisis' ? '偶發危機' : '偶發遭遇';

                card.innerHTML = `
                    <span class="badge ${badgeClass}">${badgeText}</span>
                    <div class="item-name">${item.name}</div>
                    <div class="item-status">角色: ${item.char}</div>
                    <label style="cursor:pointer">
                        <input type="checkbox" ${isChecked} onchange="toggleSave('${item.id}', this.checked)">
                        已達成
                    </label>
                `;
                container.appendChild(card);
            });

            // 每次渲染時自動更新進度條
            updateProgress(filteredData);
        }

        function showPage(category) {
            currentCategory = category;
            const titles = { tumeng: '尋找圖蒙 - 偶發事件', farewell: '最後的告別 - 偶發事件', codes: '混沌深網代碼圖鑑' };
            document.getElementById('page-title').innerText = titles[category] || '深空紀錄';
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById('nav-' + category);
            if(activeNav) activeNav.classList.add('active');

            // 切換頁面時預設顯示「全部」，並渲染
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-all').classList.add('active');
            
            renderCards(category);
        }

        function filterByChar(char, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards(currentCategory, char);
        }

        function toggleSave(id, checked) {
            console.log(`事件ID: ${id} 狀態變更為: ${checked}`);
            // 注意：這裡目前僅在控制台顯示。若要永久保存，需要更新 gameData 並存入 localStorage
        }

        window.onload = () => showPage('tumeng');
    </script>
